    # ── HIGGSFIELD ──────────────────────────────────────────────────────────
    PromptGenerationInput:
      type: object
      properties:
        vision:
          type: string
          description: User's creative vision in plain language
        mediaType:
          type: string
          enum: [image, video]
          description: Target media type
        style:
          type: ["string", "null"]
          description: Optional style hint (cinematic, anime, realistic, etc.)
        imageUrl:
          type: ["string", "null"]
          description: Optional reference image URL for image-to-video
        model:
          type: ["string", "null"]
          description: Target Higgsfield model ID
      required:
        - vision
        - mediaType

    GeneratedPrompt:
      type: object
      properties:
        prompt:
          type: string
          description: The perfectly structured Higgsfield prompt
        negativePrompt:
          type: ["string", "null"]
          description: Things to avoid
        suggestedModel:
          type: string
          description: Best model for this prompt
        aspectRatio:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        reasoning:
          type: string
          description: Why this prompt was structured this way
      required:
        - prompt
        - suggestedModel
        - reasoning

    MediaGenerationInput:
      type: object
      properties:
        model:
          type: string
        prompt:
          type: string
        imageUrl:
          type: ["string", "null"]
        aspectRatio:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        resolution:
          type: ["string", "null"]
        vision:
          type: ["string", "null"]
          description: Original user vision (for display)
      required:
        - model
        - prompt

    MediaGenerationJob:
      type: object
      properties:
        id:
          type: integer
        requestId:
          type: ["string", "null"]
        model:
          type: string
        prompt:
          type: string
        vision:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        resultUrl:
          type: ["string", "null"]
        mediaType:
          type: string
          enum: [image, video]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - model
        - prompt
        - status
        - mediaType
        - createdAt
        - updatedAt

    # ── ANTHROPIC ───────────────────────────────────────────────────────────
    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    AnthropicConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    AnthropicMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
        laeuft:
          type: boolean
          description: >-
            Ob gerade ein Zug fuer diese Unterhaltung laeuft. Die Oberflaeche
            fragt weiter nach, solange das true ist, statt nach einer festen
            Frist aufzugeben, waehrend Lukas noch arbeitet.
        laeuftSeit:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - title
        - createdAt
        - messages
    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

