name: Lukas token context regression

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - ".github/workflows/lukas-token-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check libraries and API
        run: |
          npm run typecheck:libs
          npx tsc -p artifacts/api-server/tsconfig.json --noEmit
      - name: Verify prompt and usage regressions
        working-directory: artifacts/api-server
        run: |
          node scripts/check-prompt-sparsamkeit.mjs
          node scripts/check-caching.mjs
          node scripts/check-model-routing.mjs
          node scripts/check-sparsamkeit.mjs
          node scripts/check-soul-tools.mjs
