# Was hier laeuft, lief vorher nur, wenn jemand daran dachte.
#
# Im Repo stehen achtundzwanzig check-*.mjs — jede einzelne haelt einen Fehler
# fest, der schon einmal passiert ist: die verschluckte Antwort nach
# Werkzeugen, der Chat-Stream, der grosse Bloecke verlor, die Freigabe, die
# Lukas versprochen bekam und nicht hatte. Ohne CI schuetzt das nur den, der
# vor dem Push "npm run typecheck" tippt.
#
# Bewusst kein Deploy-Schritt: Railway baut selbst von main. Hier wird
# geprueft, nicht ausgeliefert.
name: Prüfungen

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Ein neuer Push auf denselben Branch macht den vorherigen Lauf ueberfluessig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Ein echtes Postgres fuer die Migrationspruefung. Gegen eine Attrappe
    # waere sie wertlos: geprueft wird gerade, was Postgres aus den
    # Migrationen tatsaechlich macht.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci statt install: baut exakt das, was in package-lock.json steht.
      - run: npm ci

      # Enthaelt tsc über alle Pakete UND alle check-*.mjs — die Prüfungen
      # hängen bewusst am typecheck-Skript, damit sie lokal und hier
      # dieselben sind.
      - name: Typecheck und Regressionsprüfungen
        run: npm run typecheck

      - name: Build (API, Dashboard, Landingpage)
        run: npm run build --workspaces --if-present

      # Die Sicherheitsgrenze zum Schluss noch einmal einzeln, damit im
      # Protokoll auf einen Blick steht, ob sie stand.
      - name: Sicherheitsgrenze
        working-directory: artifacts/api-server
        run: |
          node scripts/check-policy-wahrheit.mjs
          node scripts/check-consent.mjs
          node scripts/check-schutz.mjs
          node scripts/check-netzschutz.mjs
          node scripts/check-browser-bedienen.mjs
          node scripts/check-telefon.mjs
          node scripts/check-betrieb.mjs
          node scripts/check-moltbook.mjs
          node scripts/check-abhaengigkeiten.mjs

      # Neuinstallation und Upgrade gegen ein echtes Postgres, auf demselben
      # Weg wie der Deploy (npm run db:deploy). Vorher deckte `db:push` jeden
      # Fehler in der Migrationskette zu — als der Deploy umgestellt wurde,
      # fehlten ihr drei Tabellen und zwei Spalten, ohne dass etwas rot wurde.
      - name: Migrationen (Neuinstallation + Upgrade)
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node lib/db/check-migrationen.mjs

      # Der Benchmark läuft im Offline-Modus mit: keine Kosten, ~1 Sekunde,
      # und er endet mit Code 1, sobald eine unsichere Aktion durchkommt.
      - name: LUKAS BENCH (offline)
        working-directory: artifacts/api-server
        run: npm run bench

      # Der Integrationslauf misst gegen ECHTE Abhängigkeiten: eigenes
      # Postgres, zwei echte Prozesse, ein echter Browser, der ganze
      # Token-Weg. Er startet sein Postgres selbst (nicht der Service oben)
      # und spielt das Schema über denselben Deploy-Pfad ein wie die
      # Produktion. Lief bisher nur, wenn jemand daran dachte.
      - name: Browser für den Integrationslauf
        run: npx playwright install --with-deps chromium

      - name: Integrationslauf (echtes Postgres, echter Browser)
        working-directory: artifacts/api-server
        run: npm run bench:integration

      # Die Python-Dienste unter vps/ hingen bisher gar nicht an der Pipeline.
      # compileall ist der ehrliche erste Schritt: es beweist, dass alle 86
      # Dateien parsen.
      - name: Python-Dienste (Syntax)
        run: python3 -m compileall -q vps/

      # Und die Gegenprobe zu requirements.txt: passt die Liste noch zu dem,
      # was die Dienste WIRKLICH importieren? Die Datei war am Tag ihrer
      # Entstehung richtig und bleibt es nur, wenn jemand sie nachzieht — was
      # niemand tut. Hier fällt es auf, statt beim nächsten Neuaufsetzen des
      # Droplets, einen Absturz nach dem anderen.
      #
      # Braucht nichts Installiertes: reine Analyse über den Syntaxbaum.
      # Deshalb muss hier kein torch heruntergeladen werden.
      - name: Python-Abhängigkeiten (requirements.txt vollständig?)
        run: python3 vps/check-requirements.py

      # Und einmal wirklich installieren — nicht bei jedem Lauf, aber wenn
      # sich die Liste ändert. Erst das macht aus den festgenagelten Versionen
      # eine Zusage statt einer Zahl: sie müssen zusammen auflösbar sein und
      # sich importieren lassen. Die auskommentierten Schwergewichte
      # (torch & Co.) bleiben draußen, wie vorgesehen.
      - name: Python-Pakete installierbar (nur wenn die Liste sich ändert)
        if: github.event_name == 'push'
        run: |
          python3 -m venv /tmp/pyprobe
          /tmp/pyprobe/bin/pip install -q --upgrade pip
          /tmp/pyprobe/bin/pip install -q -r vps/requirements.txt
          /tmp/pyprobe/bin/python - <<'PY'
          import importlib, sys
          module = ["psycopg2", "requests", "websockets", "bs4", "dotenv", "numpy",
                    "eth_account", "eth_hash", "eth_utils", "py_clob_client",
                    "google.genai", "chromadb"]
          schlecht = []
          for m in module:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  schlecht.append(f"{m}: {type(e).__name__}: {e}")
          if schlecht:
              print("FEHLER — diese Pakete liessen sich nicht importieren:")
              for z in schlecht:
                  print("  " + z)
              sys.exit(1)
          print(f"OK — alle {len(module)} Pakete installiert und importierbar.")
          PY
