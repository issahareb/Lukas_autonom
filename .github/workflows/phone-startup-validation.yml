name: Phone startup validation
on:
  push:
    branches: [fix/phone-speech-startup]
permissions:
  contents: write
concurrency:
  group: phone-startup-validation
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/fix/phone-speech-startup'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply guarded source and regression changes
        run: node scripts/apply-phone-startup-fix.mjs
      - name: Publish only to isolated branch and remove bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-phone-startup-fix.mjs .github/workflows/phone-startup-validation.yml
          git add artifacts/api-server/src/lib/ai/live-session.ts artifacts/api-server/scripts/check-live-session.mjs artifacts/lukas-ui/src/components/telefon-mithoeren.tsx
          git commit -m 'fix(phone): atomic startup context and speech-aware greeting without runtime restarts'
          git push origin HEAD:refs/heads/fix/phone-speech-startup
          echo "Testing source commit $(git rev-parse HEAD)"
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Full typecheck, regressions and production bundles
        run: npm run build
